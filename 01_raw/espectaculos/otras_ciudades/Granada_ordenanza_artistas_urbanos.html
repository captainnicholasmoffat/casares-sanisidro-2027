<br /><h2 style='text-align:justify'>Regulación de la actividad de artistas urbanos</h2><br/>

<div id="mibody" style='text-align:justify'>Junta de Gobierno Local, 1 de julio de 2016. Acuerdo 710<br>
<br>
<b>Concejalía Delegada de Emprendimiento, Turismo y Comercio </b><br>
<b>Ocupación de Vía Pública</b><br>
<br>
La Junta de Gobierno Local, en sesión celebrada el pasado día 1 de julio de 2016, adoptó acuerdo por el que se aprueba la <b>REGULACIÓN</b> <b>de la actividad de ARTISTAS URBANOS, </b>dentro del Plan Estratégico de accesibilidad de ocupación de la vía pública, cuyo tenor literal es el que sigue: 
<p><b>	</b>&#8220;<i>La Ordenanza de Medidas para fomentar y garantizar la convivencia ciudadana en el espacio público de Granada, en su art. 20.4, establece que aquellas ocupaciones, no recogidas en la Ordenanzas Municipales, tales como mimos, músicos o cualquier otro tipo de artista callejero, podrán ser autorizados por el Ayuntamiento de forma individual, siempre y cuando el solicitante se comprometa a que por su localización, horarios, intensidad, persistencia y/o contenido, no genere molestias a los ciudadanos que, a juicio de la Policía Local, resulten inadmisibles. En caso contrario la Policía Local podrá determinar la paralización inmediata del uso de la vía pública. Todo esto sin perjuicio de la legislación vigente en la materia.&#8221;</i>
<p><i>	En tanto en cuanto se produzca la autorización municipal se podrá realizar la citada ocupación de la vía pública de acuerdo al compromiso del solicitante y siguiendo las instrucciones de la Policía Local.&#8221;</i><br>
<br>
	A la vista de lo expuesto y a efectos de tramitar las correspondientes autorizaciones municipales antes referidas, se emite el siguiente informe con el fin de establecer la localización, horarios, intensidad y/o persistencia y demás cuestiones inherentes a dichas actividades, para ejercer la actividad como artistas urbanos:<br>
	1º.- La autorización municipal para ocupación de la vía pública para la realización de las actividades artísticas es la que habilita a las personas interesadas para el ejercicio de la misma, no obstante se podrá realizar la citada ocupación una vez presentada la solicitud y por un plazo máximo de 30<font color="#C20000"> </font>días a partir de los cuales, los/las interesados/as habrán de estar en posesión de la autorización individual expresa facilitada por el Ayuntamiento. <br>
	Las solicitudes correspondientes a 2016, se autorizaran todas, sin perjuicio de la fecha de presentación, en los términos contenidos en el presente acuerdo.<br>
Asimismo para la obtención del permiso en los años siguientes, hasta tanto no se modifiquen los plazos, estos serán los siguientes:<br>
	- Para obtener <b><u>permiso en el primer semestre de cada año</u></b> las solicitudes se presentarán <b>desde el día 1 de noviembre hasta 31 de diciembre, del año inmediato anterior.</b><br>
	- Para obtener <b><u>permiso en el segundo semestre de cada año</u></b> las solicitudes se presentarán <b>desde el día 1 de abril hasta el día 31 de mayo del año en curso.</b><br>
	2º.-Esta autorización se concederá en precario, pudiendo ser anulada o modificada en cualquier momento por causas justificadas, sin que su titular tenga derecho a indemnización o compensación alguna por ello.<br>
	3º.- La autorización municipal será personal e intransferible y deberá de tenerse en todo momento disponible, a fin de mostrarla en el caso de que esta sea requerida por la autoridad municipal. En el caso de que la solicitud incluya otros miembros como componentes de grupos musicales, éstos no podrán contar con más de cuatro miembros, incluido el solicitante.<br>
	4º.- Los emplazamientos se han de restringir exclusivamente a espacios expresamente autorizados definidos en la tabla que se indica a continuación, y siempre que no se produzcan dificultades para el tránsito peatonal o impidan el uso normal de dicho espacio.<br>
	Las especialidades de artistas urbanos que se autorizan son las que se detallan a continuación, estas se identifican con una letra conforme se indica a efectos de asignar el espacio donde se podrá ejercer cada actividad:<br>
·	A: músico solista<br>
·	AA: grupo de músicos (máximo 4 componentes)<br>
·	B: Mimos/Estatuas<br>
·	C: Marionetas/Teatro<br>
·	D: Globoflexia<br>
·	E: Pompas de jabón<br>
·	F: Malabares<br>
·	G: Danza<br>
Los espacios autorizados por especialidades se relacionan en la tabla siguiente:<br>

<br>
	5º.- En los espacios descritos, el horario que se establece comprende:<br>
- En temporada de invierno de 11:30 horas a 13:30 horas, en la mañana, y de 17:00 horas a 19:00 horas, en la tarde.<br>
- En temporada de verano de 11:30 horas a 13:30 horas, en la mañana y 19:00 horas a 21:00 horas, en la tarde.<br>
	En todo caso, todas las ubicaciones o emplazamientos autorizados estarán condicionados a un máximo de dos horas de actuaciones, tanto en periodo de mañana, como en el de tarde.<br>
	<br>
	Las especialidades artísticas podrán realizarse por el espacio de tiempo siguiente:<br>
- 30 minutos cuando se trate de actuaciones de grupos musicales, malabares, danza.<br>
- 45 minutos cuando se trate de solistas, teatro o marionetas, pompas de jabón, globoflexia.<br>
- 120 minutos (dos horas) cuando se trate de mimos/estatuas humanas.<br>
	6º.- El volumen de sonido emitido no podrá superar el nivel de decibelios establecido en la normativa reguladora. Se prohíbe la utilización de cualquier tipo de elementos de amplificación de sonido o de cualquier instalación para suministro de energía eléctrica.<br>
	7º.-.Queda expresamente prohibido utilizar instrumentos de percusión, como cajones flamencos, tarimas para zapatear, entarimados o cualquier infraestructura o elemento análogo que pudieran suponer contaminación acústica.<br>
	8º.- No se pueden usar animales ni recurrir a expresiones violentas ni exigir una retribución.<br>
	9º.- El solicitante, en caso de la actividad de pompas de jabón, implementará las medidas necesarias a fin de evitar vertidos de líquidos en la vía pública, haciéndose responsable de cualquier consecuencia derivada del vertido de sustancias en la misma.<br>
	10º.- Está terminantemente prohibido realizar actividades en la calzada, proximidad a los semáforos y pasos de peatones, así como  solicitar  retribución a los conductores.<br>
	11º.- Está terminantemente prohibido realizar actividades con fuego, así como con objetos punzantes o contundentes que puedan suponer algún tipo de riesgo para las personas.<br>
	12º.- Las actuaciones en un punto concreto se suspenderán en caso de incompatibilidad con actividades lúdicas o culturales que cuenten con la Autorización Municipal correspondiente.<br>
	13º.- La persona solicitante deberá comprometerse a que por su localización, horarios, intensidad, persistencia y/o contenido no genere molestias a los ciudadanos que, a juicio de la Policía Local, resulten inadmisibles. En cualquier caso, deberán seguir las indicaciones de los Agentes de la Policía Local, que podrán ordenar finalizar inmediatamente la actuación, denunciar si es necesario la posible infracción cometida, si se incumple la normativa, se molesta a los vecinos o a otros usuarios de la vía pública, se entorpece la libre circulación o se produce cualquier situación de riesgo para los peatones.<br>
<b>	</b>14º.- Deberá de darse traslado a Policía Local.
