<script type="text/javascript">
  function cargarRutaBoletines(ruta){
    var datos = { ruta: ruta };
    //showPleaseWait();
    $.ajax({
      url: $("#boletinesContainer").attr('action'),
      type: "POST",
      cache: false,
      dataType: "json",
      data: datos
    }).done(function( json ) {
      if (json){
        console.log(json);
        if (json.response==1){
          $("#boletinesContainer").html(json.html);

        }

      }
//          closePleaseWait();
}).error(function(xhr, ajaxOptions, thrownError){

});

}
$(document).ready(function(){
  cargarRutaBoletines("/");
});
