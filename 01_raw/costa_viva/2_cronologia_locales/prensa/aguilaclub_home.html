<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Águila Club - En mantenimiento</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#1b1b1b url("imagenes/slide6.jpeg") center center/cover no-repeat;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
}

.card{
    position:relative;
    z-index:2;
    max-width:650px;
    padding:50px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(8px);
    border-radius:15px;
    border:1px solid rgba(255,255,255,.2);
}

.logo{
    width:220px;
    margin-bottom:30px;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

p{
    font-size:20px;
    line-height:1.6;
}

.mail{
    margin-top:25px;
    font-size:18px;
}

.mail a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

footer{
    margin-top:35px;
    font-size:14px;
    opacity:.8;
}
</style>

</head>

<body>

<div class="overlay"></div>

<div class="card">

    <img src="assets/images/logo.png" class="logo" alt="Águila Club">

    <h1>🚧 Sitio en mantenimiento</h1>

    <p>
        Estamos realizando tareas de actualización para brindarte un mejor servicio.
    </p>

    <p style="margin-top:20px;">
        En unos días volveremos a estar online.
    </p>

   <!--  <div class="mail">
        Consultas:<br>
        <a href="mailto:info@aguilaclub.com">info@aguilaclub.com</a>
    </div> -->

    <footer>
        © 2025 Águila Club
    </footer>

</div>

</body>
</html>
